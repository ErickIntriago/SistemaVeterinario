<div class="container">

```
<!-- FORMULARIO RECETA -->
<div class="formulario-container">

    <div class="formulario">

        <input
            type="text"
            placeholder="Nombre"
            [(ngModel)]="veterinario.nombre">
          

        <input
            type="text"
            placeholder="Especialidad"
            [(ngModel)]="veterinario.especialidad">



        <button (click)="guardarVeterinario()">
            Guardar Veterinario
        </button>

    </div>

</div>

<!-- IMAGEN VETERINARIA -->
<div class="contenedor-imagen">

    <img src="/Img.png" alt="Veterinaria">

</div>
```

</div>

<!-- TABLA RECETAS -->

<div class="tabla">

```
<table>

    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Especialidad</th>
    </tr>

    <tr *ngFor="let c of veterinarios">

        <td>{{c.id_veterinario}}</td>
        <td>{{c.nombre}}</td>
        <td>{{c.especialidad}}</td>

    </tr>

</table>
```

</div>
