
<div class="container">

  <!-- FORMULARIO CLIENTE -->
  <div class="formulario-container">

    <div class="formulario">

      <input
        type="text"
        placeholder="Cédula"
        [(ngModel)]="cliente.cedula">

      <input
        type="text"
        placeholder="Nombre"
        [(ngModel)]="cliente.nombre">

      <input
        type="text"
        placeholder="Apellido"
        [(ngModel)]="cliente.apellido">

      <input
        type="text"
        placeholder="Teléfono"
        [(ngModel)]="cliente.telefono">

      <input
        type="text"
        placeholder="Dirección"
        [(ngModel)]="cliente.direccion">

      <input
        type="email"
        placeholder="Correo"
        [(ngModel)]="cliente.correo">

      <!-- BOTÓN GUARDAR / ACTUALIZAR -->
     <button (click)="guardarCliente()">
       
        {{ editando ? 'Actualizar Cliente' : 'Guardar Cliente' }}
      </button>

      <!-- BOTÓN CANCELAR -->
      <button
        *ngIf="editando"
        type="button"
        (click)="cancelarEdicion()">
        Cancelar
      </button>

    </div>

  </div>

  <!-- IMAGEN -->
  <div class="contenedor-imagen">

    <img
      src="/Img.png"
      alt="Veterinaria">

  </div>

</div>


<!-- TABLA CLIENTES -->

<div class="tabla">

  <table>

    <tr>
      <th>ID</th>
      <th>Cédula</th>
      <th>Nombre</th>
      <th>Apellido</th>
      <th>Teléfono</th>
      <th>Dirección</th>
      <th>Correo</th>
      <th>Acciones</th>
    </tr>

    <tr *ngFor="let c of clientes">

      <td>{{ c.id_cliente }}</td>

      <td>{{ c.cedula }}</td>

      <td>{{ c.nombre }}</td>

      <td>{{ c.apellido }}</td>

      <td>{{ c.telefono }}</td>

      <td>{{ c.direccion }}</td>

      <td>{{ c.correo }}</td>

      <td>

        <button
          type="button"
          (click)="editarCliente(c)">
          ✏️ Editar
        </button>

        <button
          type="button"
          (click)="eliminarCliente(c.id_cliente!)">
          🗑️ Eliminar
        </button>

      </td>

    </tr>

  </table>

</div>
```
